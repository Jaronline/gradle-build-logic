root:
  - changed-files:
      - any-glob-to-any-file:
          - build.gradle.kts
          - settings.gradle.kts
          - src/*
          - src/**/*
buildSrc:
  - changed-files:
      - any-glob-to-any-file:
          - buildSrc/*
          - buildSrc/**/*
gradlew:
  - changed-files:
      - any-glob-to-any-file:
          - gradle/wrapper/*
          - gradle/wrapper/**/*
          - gradlew
          - gradlew.bat
versions:
  - changed-files:
      - any-glob-to-any-file:
          - gradle/libs.versions.toml
"module: formatting":
  - changed-files:
      - any-glob-to-any-file:
          - formatting/*
          - formatting/**/*
"module: kotlin":
  - changed-files:
      - any-glob-to-any-file:
          - kotlin/*
          - kotlin/**/*
"module: project":
  - changed-files:
      - any-glob-to-any-file:
          - project/*
          - project/**/*
"module: publish":
  - changed-files:
      - any-glob-to-any-file:
          - publish/*
          - publish/**/*